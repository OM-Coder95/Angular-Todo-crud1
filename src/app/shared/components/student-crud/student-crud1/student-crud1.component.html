<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1 class="bg-info text-center text-white p-2">Stdent CRUD in Angular</h1>
        </div>
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-info">
                    <h2 class="text-center text-white">{{!isInEditMode ? 'Add Student' : 'Update Student'}}</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" class="form-control" #firstNameRef>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" class="form-control" #lastNameRef>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" #emailRef>
                    </div>
                    <div class="form-group">
                        <label for="Contact">Contact</label>
                        <input type="number" class="form-control" #contactRef>
                    </div>
                    <div class="form-group">
                        <label for="isActive">Is Active</label>
                        <select class="form-control" #isActiveRef>
                            <option value="yes">True</option>
                            <option value="no">False</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button *ngIf="
                        !isInEditMode" (click)="onStudentAdd()" mat-raised-button color="primary" class="w-100">Add
                            Student</button>
                        <button (click)="onStudentUpdate()" *ngIf="isInEditMode" mat-raised-button color="primary"
                            class="w-100">Update
                            Student</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-10 mt-4 mb-2 offset-md-1">
            <div *ngIf="studentArr.length > 0; else noStudent" class="card">
                <div class="card-header bg-info">
                    <h2 class="text-center text-white">Student List</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr class="text-center">
                                    <th>Sr. No.</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>Is Active</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="text-center"
                                    *ngFor="let stu of studentArr; trackBy : trackById; let i = index">
                                    <td>{{i + 1}}</td>
                                    <td>{{stu.firstName}} {{stu.lastName}}</td>
                                    <td>{{stu.email}}</td>
                                    <td>{{stu.contact}}</td>
                                    <td>
                                        <input [checked]="stu.isActive" type="checkbox"
                                            (change)="onStateChange(stu.id, $event)" class="mr-1">
                                        <span class="badge p-2" [ngClass]="({
                                        'badge-success' : stu.isActive, 'badge-danger' : !stu.isActive 
                                        })">
                                            {{stu.isActive ? 'Active' : 'Inactive'}}
                                        </span>
                                    </td>
                                    <td><button (click)="onStduentEdit(stu)" mat-mini-fab color="primary">
                                            <mat-icon>edit</mat-icon>
                                        </button></td>
                                    <td>
                                        <button [disabled]="isInEditMode && editId===stu.id"
                                            (click)="onStudentDelete(stu.id)" mat-mini-fab color="warn">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
            <ng-template #noStudent>
                <p class="aleter alert-danger text-center p-2">No Student Added Yet!</p>
            </ng-template>
        </div>
    </div>
</div>
